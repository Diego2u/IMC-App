<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>IMC</title>
</head>
<body>
    <h1>Bienvenido, <span th:text="${usuario.nombreCompleto}"></span></h1>

    <form th:action="@{/imc}" method="post">
        <label>Peso (kg): </label>
        <input type="number" step="0.1" name="peso" required />
        <button type="submit">Calcular IMC</button>
    </form>

    <div th:if="${imc}">
        <h2>Resultado del IMC:</h2>
        <p>Tu IMC actual es: <span th:text="${imc}"></span></p>
        <p>Clasificación: <span th:text="${clasificacion}"></span></p>
    </div>

    <div th:if="${historial}">
        <h2>Historial de cálculos</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Peso (kg)</th>
                    <th>IMC</th>
                    <th>Clasificación</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="registro : ${historial}">
                    <td th:text="${#temporals.format(registro.fecha, 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${registro.peso}"></td>
                    <td th:text="${#numbers.formatDecimal(registro.imc, 1, 2)}"></td>
                    <td th:text="${registro.clasificacion}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <br/>
    <a th:href="@{/logout}">Cerrar sesión</a>
</body>
</html>
