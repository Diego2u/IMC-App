<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
</head>
<body>
    <h1>Registro de Usuario</h1>
    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        
        Nombre completo: 
        <input type="text" th:field="*{nombreCompleto}" required/><br/>
        <p th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></p>

        Edad: 
        <input type="number" th:field="*{edad}" min="15" required/><br/>
        <p th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></p>

        Sexo: 
        <select th:field="*{sexo}">
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
        </select><br/>
        <p th:if="${#fields.hasErrors('sexo')}" th:errors="*{sexo}"></p>

        Estatura (en metros): 
        <input type="number" step="0.01" th:field="*{estatura}" min="1.0" max="2.5" required/><br/>
        <p th:if="${#fields.hasErrors('estatura')}" th:errors="*{estatura}"></p>

        Peso (en kg):
        <input type="number" step="0.1" th:field="*{peso}" min="30" max="250" required/><br/>

        Nombre de usuario: 
        <input type="text" th:field="*{nombreUsuario}" required/><br/>
        <p th:if="${#fields.hasErrors('nombreUsuario')}" th:errors="*{nombreUsuario}"></p>

        Contraseña: 
        <input type="password" th:field="*{contrasena}" required/><br/>
        <p th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></p>

        

        <br/>
        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
